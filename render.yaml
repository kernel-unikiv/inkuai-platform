services:
  - type: web
    name: inkuai-platform
    env: node
    region: frankfurt
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm run seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://inkuai-platform.onrender.com
      # DATABASE_URL → adicionar manualmente (Supabase)
      # MONGODB_URI  → adicionar manualmente (Atlas) - OPCIONAL

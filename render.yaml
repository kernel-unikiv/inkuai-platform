services:
  - type: web
    name: inkuai-platform
    env: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run migrate && npm run seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://inkuai-platform.onrender.com
      # ═══════════════════════════════════════════════════════
      # ADICIONAR MANUALMENTE no Dashboard do Render:
      # Dashboard → inkuai-platform → Environment → Add Variable
      #
      # 1. DATABASE_URL = postgresql://...  (Supabase)
      # 2. GEMINI_API_KEY = AIzaSy...
      #    Chave GRATUITA em: https://aistudio.google.com/apikey
      # ═══════════════════════════════════════════════════════

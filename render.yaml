services:
  - type: web
    name: inkuai-platform
    env: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run migrate && npm run seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://inkuai-platform.onrender.com
      # ══ OBRIGATÓRIO: Adicionar manualmente no Dashboard do Render ══
      # Dashboard → inkuai-platform → Environment → Add Variable
      # DATABASE_URL = postgresql://user:pass@host/db  (Supabase)
      # ANTHROPIC_API_KEY = sk-ant-api03-...           (console.anthropic.com)

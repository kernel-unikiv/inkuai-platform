services:
  - type: web
    name: inkuai-platform
    env: node
    region: frankfurt
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm run migrate && npm run seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://inkuai-platform.onrender.com
      # ⚠️  IMPORTANTE — Para usar PostgreSQL em produção:
      # 1. Crie uma BD gratuita em https://supabase.com
      # 2. Copie a CONNECTION STRING da BD (ex: postgresql://user:pass@host/db)
      # 3. Adicione abaixo como DATABASE_URL
      # - key: DATABASE_URL
      #   value: postgresql://user:password@db.xxx.supabase.co:5432/postgres
      #
      # Se não configurar, usa SQLite em /tmp/inkuai.sqlite (dados não persistem após restart)

name: INKU·AI — Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependências
        working-directory: backend
        run: npm install
      - name: Testar health endpoint
        working-directory: backend
        run: |
          NODE_ENV=test JWT_SECRET=test JWT_REFRESH_SECRET=test \
          node -e "
            const app = require('./src/app');
            const server = app.listen(5001, () => {
              const http = require('http');
              http.get('http://localhost:5001/health', (r) => {
                console.log('Health:', r.statusCode);
                server.close();
                process.exit(r.statusCode === 200 ? 0 : 1);
              });
            });
          " || echo "App iniciou"

  deploy:
    name: Deploy → Render.com
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "✅ Deploy iniciado no Render.com"
          else
            echo "⚠️  RENDER_DEPLOY_HOOK não configurado — deploy manual necessário"
          fi

name: INKU·AI — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testes & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependências
        working-directory: backend
        run: npm ci
      - name: Auditoria de segurança
        working-directory: backend
        run: npm audit --audit-level=high || true
      - name: Executar testes
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-key-inkuai
          JWT_REFRESH_SECRET: ci-refresh-secret-inkuai
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inkuai_test
          MONGODB_URI: mongodb://localhost:27017/inkuai_test

  docker-build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t inkuai-backend:${{ github.sha }} ./backend
      - name: Test health endpoint
        run: |
          docker run -d -p 5000:5000 \
            -e NODE_ENV=test -e JWT_SECRET=ci-test \
            -e JWT_REFRESH_SECRET=ci-refresh \
            --name inkuai-ci inkuai-backend:${{ github.sha }}
          sleep 8
          curl -f http://localhost:5000/health
          docker stop inkuai-ci

  deploy:
    name: Deploy → Render
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy no Render.com
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

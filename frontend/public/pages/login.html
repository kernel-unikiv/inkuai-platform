<!DOCTYPE html>
<html lang="pt" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — INKU·AI | IP/UNIKIVI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center mb-3"
           style="width:52px;height:52px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:12px">
        <i class="bi bi-cpu-fill text-white fs-4"></i>
      </div>
      <h4 class="fw-bold text-white mb-1">INKU<span style="color:#3b82f6">·AI</span></h4>
      <p class="text-muted small">Instituto Politécnico / UNIKIVI</p>
    </div>

    <h5 class="fw-semibold text-white mb-4">Entrar na plataforma</h5>

    <form id="login-form">
      <div class="mb-3">
        <label class="form-label-dark">Email institucional</label>
        <input type="email" id="email" class="form-control-dark" placeholder="exemplo@ip.unikivi.ao" required>
      </div>
      <div class="mb-4">
        <label class="form-label-dark">Password</label>
        <input type="password" id="password" class="form-control-dark" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-inkuai w-100 justify-content-center mb-3">
        <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
      </button>
    </form>

    <div class="text-center">
      <a href="forgot-password.html" class="text-muted small text-decoration-none">Esqueceu a password?</a>
    </div>
    <hr style="border-color:var(--inkuai-border);margin:20px 0">
    <p class="text-center text-muted small mb-0">
      Ainda não tem conta? <a href="register.html" style="color:#3b82f6">Criar conta</a>
    </p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api/apiClient.js"></script>
<script src="../assets/js/components/toast.js"></script>
<script src="../assets/js/pages/auth.js"></script>
</body>
</html>

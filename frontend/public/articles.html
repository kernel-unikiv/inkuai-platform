<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artigos & Ideias — INKU·AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563eb'/><text y='24' x='4' font-size='22' fill='white'>⚡</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/main.css" rel="stylesheet">
  <style>
    .art-card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:20px;cursor:pointer;transition:all .18s;height:100%;}
    .art-card:hover{border-color:var(--blue-200);box-shadow:var(--shadow-md);transform:translateY(-2px);}
    .cat-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:var(--r-full);font-size:0.7rem;font-weight:700;}
    .cat-ideia       {background:rgba(245,158,11,.12);color:#d97706;}
    .cat-artigo      {background:rgba(37,99,235,.1); color:#2563eb;}
    .cat-investigacao{background:rgba(22,163,74,.1); color:#16a34a;}
    .cat-inovacao    {background:rgba(124,58,237,.1);color:#7c3aed;}
  </style>
</head>
<body>
<div class="dashboard-layout">
  <aside class="sidebar" id="main-sidebar">
    <a href="/dashboard.html" class="sidebar-brand">
      <div class="brand-logo"><i class="bi bi-cpu-fill"></i></div>
      <div><div class="brand-name">INKU<span style="color:var(--blue-400);">·AI</span></div><div class="brand-sub">IP/UNIKIVI</div></div>
    </a>
    <nav class="sidebar-nav">
      <span class="sidebar-section-label">Principal</span>
      <a href="/dashboard.html"    class="sidebar-link"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a>
      <a href="/projects.html"     class="sidebar-link"><i class="bi bi-folder2-open"></i>Projectos</a>
      <a href="/startups.html"     class="sidebar-link"><i class="bi bi-rocket-takeoff"></i>Startups</a>
      <a href="/articles.html"     class="sidebar-link active"><i class="bi bi-lightbulb-fill"></i>Artigos &amp; Ideias</a>
      <a href="/roadmap.html"      class="sidebar-link"><i class="bi bi-map-fill"></i>Roadmap</a>
      <a href="/classroom.html"    class="sidebar-link"><i class="bi bi-mortarboard-fill"></i>Classroom</a>
      <span class="sidebar-section-label">IA &amp; Ferramentas</span>
      <a href="/ai-assistant.html" class="sidebar-link"><i class="bi bi-robot"></i>INKU·AI Chat</a>
      <a href="/sandbox.html"      class="sidebar-link"><i class="bi bi-terminal-fill"></i>Sandbox IA</a>
      <a href="/ai-models.html"    class="sidebar-link"><i class="bi bi-braces"></i>Modelos IA</a>
      <a href="/datasets.html"     class="sidebar-link"><i class="bi bi-database-fill"></i>Datasets</a>
      <span class="sidebar-section-label">Conta</span>
      <a href="/messages.html"     class="sidebar-link"><i class="bi bi-chat-dots-fill"></i>Mensagens</a>
      <a href="/profile.html"      class="sidebar-link"><i class="bi bi-person-fill"></i>Perfil</a>
      <a href="/mentorship.html"   class="sidebar-link"><i class="bi bi-people-fill"></i>Mentoria</a>
      <a href="/admin/admin-dashboard.html" class="sidebar-link" id="admin-link" style="display:none"><i class="bi bi-shield-fill"></i>Administração</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user" onclick="location.href='/profile.html'">
        <div class="sidebar-user-avatar" id="user-avatar">U</div>
        <div style="flex:1;overflow:hidden;"><div class="sidebar-user-name truncate" data-user-name>Utilizador</div><div class="sidebar-user-role" data-user-role>student</div></div>
        <button onclick="event.stopPropagation();doLogout()" class="btn btn-link p-0" style="color:rgba(255,255,255,0.3);" title="Sair"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <button id="sidebar-toggle" class="btn btn-link d-lg-none p-0 me-2" style="color:var(--text-muted)"><i class="bi bi-list" style="font-size:1.3rem;"></i></button>
      <span class="topbar-title">Artigos &amp; Ideias</span>
      <div class="ms-auto d-flex align-items-center gap-2">
        <div id="notif-mount"></div>
        <button class="btn-inkuai btn-inkuai-sm" data-bs-toggle="modal" data-bs-target="#newArticleModal">
          <i class="bi bi-plus-lg me-1"></i>Publicar
        </button>
      </div>
    </div>

    <div class="page-content">
      <!-- Filters -->
      <div class="inkuai-card mb-4">
        <div class="row g-3 align-items-center">
          <div class="col-md-5">
            <div class="position-relative">
              <i class="bi bi-search position-absolute" style="left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);"></i>
              <input type="text" id="search-input" class="form-control-dark" placeholder="Pesquisar artigos e ideias..." style="padding-left:36px;">
            </div>
          </div>
          <div class="col-md-4">
            <select id="cat-filter" class="form-control-dark">
              <option value="">Todas as categorias</option>
              <option value="ideia">💡 Ideias</option>
              <option value="artigo">📄 Artigos</option>
              <option value="investigacao">🔬 Investigação</option>
              <option value="inovacao">🚀 Inovação</option>
            </select>
          </div>
          <div class="col-md-3">
            <button class="btn-inkuai w-100 justify-content-center" onclick="loadArticles()"><i class="bi bi-search me-1"></i>Filtrar</button>
          </div>
        </div>
        <div class="d-flex flex-wrap gap-2 mt-3">
          <button class="filter-chip active" data-cat="" onclick="setCatFilter('',this)">Todos</button>
          <button class="filter-chip" data-cat="ideia"        onclick="setCatFilter('ideia',this)">💡 Ideias</button>
          <button class="filter-chip" data-cat="artigo"       onclick="setCatFilter('artigo',this)">📄 Artigos</button>
          <button class="filter-chip" data-cat="investigacao" onclick="setCatFilter('investigacao',this)">🔬 Investigação</button>
          <button class="filter-chip" data-cat="inovacao"     onclick="setCatFilter('inovacao',this)">🚀 Inovação</button>
        </div>
      </div>

      <div id="articles-grid"><div class="row g-4">${renderSkeletons()}</div></div>
      <div id="pagination" class="d-flex justify-content-center gap-2 mt-4"></div>
    </div>
  </main>
</div>

<!-- New Article Modal -->
<div class="modal fade" id="newArticleModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-lightbulb-fill me-2" style="color:var(--warning);"></i>Publicar Ideia / Artigo</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label-dark">Título <span style="color:var(--danger);">*</span></label>
            <input type="text" id="art-title" class="form-control-dark" placeholder="Ex: Uso de IA para Agricultura de Precisão em Angola">
          </div>
          <div class="col-md-6">
            <label class="form-label-dark">Categoria</label>
            <select id="art-category" class="form-control-dark">
              <option value="ideia">💡 Ideia</option>
              <option value="artigo">📄 Artigo</option>
              <option value="investigacao">🔬 Investigação</option>
              <option value="inovacao">🚀 Inovação</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label-dark">Tags <span class="form-hint d-inline">(separadas por vírgulas)</span></label>
            <input type="text" id="art-tags" class="form-control-dark" placeholder="IA, Angola, inovação...">
          </div>
          <div class="col-12">
            <label class="form-label-dark">Resumo</label>
            <textarea id="art-summary" class="form-control-dark" rows="2" placeholder="Resumo breve..."></textarea>
          </div>
          <div class="col-12">
            <label class="form-label-dark">Conteúdo <span style="color:var(--danger);">*</span></label>
            <textarea id="art-content" class="form-control-dark" rows="7" placeholder="Escreva o conteúdo completo..."></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn-inkuai" id="save-article-btn" onclick="saveArticle()"><i class="bi bi-send me-2"></i>Publicar</button>
      </div>
    </div>
  </div>
</div>

<style>
.filter-chip{background:none;border:1.5px solid var(--border-medium);border-radius:var(--r-full);padding:5px 14px;font-size:0.78rem;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all .15s;}
.filter-chip:hover,.filter-chip.active{background:var(--brand-primary);border-color:var(--brand-primary);color:#fff;}
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api/apiClient.js"></script>
<script src="/assets/js/components/toast.js"></script>
<script src="/assets/js/components/sidebar.js"></script>
<script>
const CAT_LABEL = {ideia:'💡 Ideia',artigo:'📄 Artigo',investigacao:'🔬 Investigação',inovacao:'🚀 Inovação'};

function setCatFilter(cat, btn) {
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('cat-filter').value = cat;
  loadArticles(1);
}

function renderSkeletons() {
  return Array(6).fill(`<div class="col-md-6 col-xl-4"><div class="inkuai-card"><div class="skeleton skeleton-title mb-2"></div><div class="skeleton skeleton-text mb-2"></div><div class="skeleton skeleton-text" style="width:60%;"></div></div></div>`).join('');
}

async function loadArticles(page=1) {
  const search = document.getElementById('search-input').value.trim();
  const cat    = document.getElementById('cat-filter').value;
  const grid   = document.getElementById('articles-grid');
  grid.innerHTML = `<div class="row g-4">${renderSkeletons()}</div>`;
  try {
    let qs = `page=${page}&limit=9`;
    if (search) qs += `&search=${encodeURIComponent(search)}`;
    if (cat)    qs += `&category=${cat}`;
    const res = await window.InkuAPI.get(`/articles?${qs}`);
    const articles = res.data || [];
    const pag = res.pagination || {};
    if (!articles.length) {
      grid.innerHTML = `<div class="inkuai-empty"><span class="inkuai-empty-icon"><i class="bi bi-lightbulb"></i></span><h5>Sem conteúdo</h5><p>${search?'Sem resultados para "'+search+'"':'Seja o primeiro a publicar!'}</p><button class="btn-inkuai" data-bs-toggle="modal" data-bs-target="#newArticleModal"><i class="bi bi-plus-lg me-2"></i>Publicar Ideia</button></div>`;
      document.getElementById('pagination').innerHTML = '';
      return;
    }
    grid.innerHTML = `<div class="row g-4">${articles.map(a => {
      const tags = (() => { try { return JSON.parse(a.tags_json||'[]'); } catch { return []; } })();
      return `<div class="col-md-6 col-xl-4"><div class="art-card" onclick="location.href='/article-detail.html?id=${a.id}'">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <span class="cat-badge cat-${a.category}">${CAT_LABEL[a.category]||a.category}</span>
          <span style="font-size:0.72rem;color:var(--text-muted);">${new Date(a.created_at).toLocaleDateString('pt-PT')}</span>
        </div>
        <h6 style="font-weight:700;margin-bottom:6px;line-height:1.4;" class="line-clamp-2">${a.title}</h6>
        <p class="line-clamp-3" style="font-size:0.82rem;color:var(--text-muted);margin-bottom:12px;">${a.summary||a.content?.substring(0,150)||''}</p>
        ${tags.length ? `<div class="d-flex flex-wrap gap-1 mb-3">${tags.slice(0,3).map(t=>`<span class="tag tag-gray">${t}</span>`).join('')}</div>` : ''}
        <div class="d-flex align-items-center justify-content-between pt-2" style="border-top:1px solid var(--border-light);">
          <div class="d-flex align-items-center gap-2">
            <div class="avatar avatar-xs" style="background:var(--brand-gradient);font-weight:700;font-size:0.6rem;color:#fff;">${(a.author?.name||'?')[0].toUpperCase()}</div>
            <span style="font-size:0.78rem;color:var(--text-muted);">${a.author?.name||'Anónimo'}</span>
          </div>
          <div style="font-size:0.72rem;color:var(--text-muted);">
            <i class="bi bi-eye me-1"></i>${a.views||0} <i class="bi bi-heart ms-2 me-1"></i>${a.likes||0}
          </div>
        </div>
      </div></div>`;
    }).join('')}</div>`;
    const totalPages = pag.pages || 1;
    if (totalPages > 1) {
      document.getElementById('pagination').innerHTML = Array.from({length:totalPages},(_,i)=>
        `<button onclick="loadArticles(${i+1})" class="${i+1===page?'btn-inkuai':'btn-inkuai-secondary'} btn-inkuai-sm">${i+1}</button>`).join('');
    }
  } catch(e) {
    grid.innerHTML = `<div class="inkuai-empty"><span class="inkuai-empty-icon"><i class="bi bi-exclamation-triangle"></i></span><h5>Erro ao carregar</h5><p>${e.message}</p></div>`;
  }
}

async function saveArticle() {
  const title   = document.getElementById('art-title').value.trim();
  const content = document.getElementById('art-content').value.trim();
  if (!title)   { showToast('Título obrigatório.','warning'); return; }
  if (!content) { showToast('Conteúdo obrigatório.','warning'); return; }
  const btn = document.getElementById('save-article-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>A publicar...';
  try {
    const tags = document.getElementById('art-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
    await window.InkuAPI.post('/articles', {
      title, content,
      summary:   document.getElementById('art-summary').value,
      category:  document.getElementById('art-category').value,
      tags_json: JSON.stringify(tags)
    });
    bootstrap.Modal.getInstance(document.getElementById('newArticleModal')).hide();
    showToast('Publicado com sucesso!','success');
    ['art-title','art-content','art-summary','art-tags'].forEach(id => { document.getElementById(id).value=''; });
    loadArticles();
  } catch(e) { showToast(e.message,'error'); }
  finally { btn.disabled=false; btn.innerHTML='<i class="bi bi-send me-2"></i>Publicar'; }
}

document.getElementById('search-input')?.addEventListener('keyup', e => { if(e.key==='Enter') loadArticles(); });
const usr = window.InkuAuth?.getUser?.();
if(usr?.role==='admin') document.getElementById('admin-link').style.display='';
if(usr?.name) document.getElementById('user-avatar').textContent = usr.name[0].toUpperCase();
document.addEventListener('DOMContentLoaded', () => loadArticles());
</script>
<script src="/assets/js/components/notifications.js"></script>
<script src="/assets/js/components/mentor-ai.js"></script>
</body>
</html>

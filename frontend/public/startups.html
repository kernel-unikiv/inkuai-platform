<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startups — INKU·AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/main.css" rel="stylesheet">
</head>
<body>
<div class="dashboard-layout">
    <aside class="sidebar">
    <a href="/dashboard.html" class="sidebar-brand">
      <div class="brand-logo"><i class="bi bi-cpu-fill"></i></div>
      <div><div class="brand-name">INKU<span style="color:#60a5fa">·AI</span></div><div class="brand-sub">IP/UNIKIVI</div></div>
    </a>
    <nav class="sidebar-nav">
      <span class="sidebar-section-label">Principal</span>
      <a href="/dashboard.html"    class="sidebar-link"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a>
      <a href="/projects.html"     class="sidebar-link "><i class="bi bi-folder2-open"></i>Projectos</a>
      <a href="/startups.html"     class="sidebar-link active"><i class="bi bi-rocket-takeoff"></i>Startups</a>
      <a href="/articles.html"     class="sidebar-link "><i class="bi bi-lightbulb-fill"></i>Artigos &amp; Ideias</a>
      <a href="/classroom.html"    class="sidebar-link "><i class="bi bi-mortarboard-fill"></i>Classroom</a>
      <a href="/sandbox.html"      class="sidebar-link "><i class="bi bi-terminal-fill"></i>Sandbox IA</a>
      <a href="/ai-assistant.html" class="sidebar-link "><i class="bi bi-robot"></i>INKU·AI Chat</a>
      <a href="/ai-models.html"    class="sidebar-link "><i class="bi bi-braces"></i>Modelos IA</a>
      <span class="sidebar-section-label">Académico</span>
      <a href="/mentorship.html"   class="sidebar-link "><i class="bi bi-mortarboard-fill"></i>Mentoria</a>
      <a href="/datasets.html"     class="sidebar-link "><i class="bi bi-database-fill"></i>Datasets</a>
      <span class="sidebar-section-label">Conta</span>
      <a href="/messages.html"     class="sidebar-link " id="msg-nav-link"><i class="bi bi-chat-dots-fill"></i>Mensagens <span class="badge bg-danger ms-auto msg-unread-badge" style="display:none;font-size:0.6rem;padding:2px 5px">0</span></a>
      <a href="/profile.html"      class="sidebar-link "><i class="bi bi-person-fill"></i>Perfil</a>
      <a href="/admin/admin-dashboard.html" class="sidebar-link" id="admin-link" style="display:none"><i class="bi bi-shield-fill"></i>Administração</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar" id="user-avatar">U</div>
        <div style="flex:1;overflow:hidden;min-width:0"><div class="sidebar-user-name text-truncate" data-user-name>Utilizador</div><div class="sidebar-user-role" data-user-role>student</div></div>
        <button onclick="doLogout()" class="btn-ghost" style="color:rgba(255,255,255,0.3);padding:4px 6px;font-size:0.875rem" title="Sair"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
<main class="main-content">
    <div class="topbar">
      <button id="sidebar-toggle" class="btn-ghost d-lg-none" style="color:var(--text-muted);margin-right:4px" onclick="toggleSidebar()"><i class="bi bi-list fs-4"></i></button>
      <span class="topbar-title">Startups</span>
      <div id="notif-mount" class="d-flex align-items-center me-2"></div>
      <div class="ms-auto">
        <button class="btn-inkuai" data-bs-toggle="modal" data-bs-target="#newStartupModal">
          <i class="bi bi-plus-lg me-2"></i>Nova Startup
        </button>
      </div>
    </div>

    <div class="page-content">
      <div class="inkuai-card mb-4">
        <div class="row g-3 align-items-end">
          <div class="col-md-7">
            <label class="form-label-dark">Pesquisar</label>
            <div class="position-relative">
              <i class="bi bi-search position-absolute" style="left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted)"></i>
              <input type="text" id="search-startup" class="form-control-dark" style="padding-left:36px" placeholder="Nome da startup...">
            </div>
          </div>
          <div class="col-md-4">
            <label class="form-label-dark">Estado</label>
            <select id="status-startup" class="form-control-dark">
              <option value="">Todas</option>
              <option value="draft">Rascunho</option>
              <option value="active">Activa</option>
              <option value="graduated">Graduada</option>
            </select>
          </div>
          <div class="col-md-1">
            <button onclick="loadStartups()" class="btn btn-primary w-100"><i class="bi bi-search"></i></button>
          </div>
        </div>
      </div>

      <div id="startups-grid" class="row g-3">
        <div class="col-12 text-center py-5" style="color:var(--text-muted)">
          <div class="spinner-border text-primary"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal fade" id="newStartupModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-rocket-takeoff me-2" style="color:var(--ink-400)"></i>Nova Startup</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-12"><label class="form-label-dark">Nome *</label><input type="text" id="st-name" class="form-control-dark" placeholder="Ex: AgroIA Angola"></div>
          <div class="col-md-6">
            <label class="form-label-dark">Sector *</label>
            <select id="st-sector" class="form-control-dark">
              <option>IA/Software</option><option>AgriTech</option><option>HealthTech</option>
              <option>EduTech</option><option>FinTech</option><option>Dados & Analytics</option><option>Outro</option>
            </select>
          </div>
          <div class="col-md-6"><label class="form-label-dark">GitHub (opcional)</label><input type="url" id="st-github" class="form-control-dark" placeholder="https://github.com/org"></div>
          <div class="col-12"><label class="form-label-dark">Descrição *</label><textarea id="st-desc" class="form-control-dark" rows="4" placeholder="Missão, visão e problema que resolve..."></textarea></div>
          <div class="col-12"><label class="form-label-dark">Tags (separadas por vírgulas)</label><input type="text" id="st-tags" class="form-control-dark" placeholder="ia, machine-learning, angola, agro"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn-inkuai" id="save-startup-btn"><i class="bi bi-save me-2"></i>Criar Startup</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api/apiClient.js"></script>
<script src="/assets/js/components/toast.js"></script>
<script src="/assets/js/components/sidebar.js"></script>
<script>
const PALETTE = ['var(--ink-400)','#16a34a','#7c3aed','#d97706','#dc2626','#0284c7'];

async function loadStartups() {
  const search = document.getElementById('search-startup').value;
  const status = document.getElementById('status-startup').value;
  const grid = document.getElementById('startups-grid');
  grid.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div>';
  try {
    let ep = '/startups?limit=12';
    if (search) ep += `&search=${encodeURIComponent(search)}`;
    if (status) ep += `&status=${status}`;
    const res = await window.InkuAPI.get(ep);
    const startups = res.data || [];
    if (!startups.length) {
      grid.innerHTML = '<div class="col-12 text-center py-5"><i class="bi bi-rocket fs-1 d-block mb-3" style="color:var(--text-muted)"></i><p style="color:var(--text-muted)">Nenhuma startup encontrada.</p></div>';
      return;
    }
    grid.innerHTML = startups.map((s,i) => `
      <div class="col-md-6 col-xl-4">
        <div class="project-card">
          <div class="d-flex align-items-center gap-3 mb-3">
            <div style="width:48px;height:48px;background:${PALETTE[i%PALETTE.length]}18;border:1px solid ${PALETTE[i%PALETTE.length]}30;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;color:${PALETTE[i%PALETTE.length]};flex-shrink:0">${s.name[0]}</div>
            <div>
              <div style="font-weight:700;color:var(--text-primary)">${s.name}</div>
              <span class="status status-${s.status}">${s.status}</span>
            </div>
          </div>
          <p style="font-size:0.82rem;color:var(--text-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px">${s.description||''}</p>
          <div class="d-flex align-items-center gap-2 mb-3">
            <span class="badge" style="background:var(--ink-50);color:var(--ink-500);font-size:0.72rem">${s.sector||'IA/Software'}</span>
            ${s.github_url?`<a href="${s.github_url}" target="_blank" style="color:var(--text-muted);font-size:0.78rem;text-decoration:none"><i class="bi bi-github me-1"></i>GitHub</a>`:''}
          </div>
          <div class="d-flex gap-2 pt-2" style="border-top:1px solid var(--border-light)">
            <a href="/startup-detail.html?id=${s.id}" class="btn btn-sm btn-primary flex-fill">Ver Detalhes</a>
            <button class="btn btn-sm btn-outline-secondary" title="Adicionar membro"><i class="bi bi-person-plus"></i></button>
          </div>
        </div>
      </div>`).join('');
  } catch(err) {
    grid.innerHTML = `<div class="col-12 text-center py-5 text-danger">${err.message}</div>`;
  }
}

document.getElementById('save-startup-btn')?.addEventListener('click', async () => {
  const btn = document.getElementById('save-startup-btn');
  btn.disabled=true; btn.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>A criar...';
  try {
    const tags = document.getElementById('st-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
    await window.InkuAPI.post('/startups',{
      name: document.getElementById('st-name').value,
      description: document.getElementById('st-desc').value,
      sector: document.getElementById('st-sector').value,
      github_url: document.getElementById('st-github').value||null, tags
    });
    bootstrap.Modal.getInstance(document.getElementById('newStartupModal')).hide();
    window.showToast?.('Startup criada!','success');
    loadStartups();
  } catch(err){ window.showToast?.(err.message,'error'); }
  finally{ btn.disabled=false; btn.innerHTML='<i class="bi bi-save me-2"></i>Criar Startup'; }
});

['search-startup','status-startup'].forEach(id=>document.getElementById(id)?.addEventListener('change',loadStartups));
const usr=window.InkuAuth?.getUser();
if(usr?.role==='admin') document.getElementById('admin-link').style.display='';
if(usr?.name) document.getElementById('user-avatar').textContent=usr.name[0].toUpperCase();
document.addEventListener('DOMContentLoaded',loadStartups);
</script>
<script src="/assets/js/components/notifications.js"></script>
</body>
</html>

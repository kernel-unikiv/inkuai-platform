<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startup — INKU·AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/main.css" rel="stylesheet">
</head>
<body>
<div class="dashboard-layout">
  <aside class="sidebar">
    <a href="/dashboard.html" class="sidebar-brand">
      <div class="brand-logo"><i class="bi bi-cpu-fill"></i></div>
      <div><div class="brand-name">INKU<span style="color:#60a5fa">·AI</span></div><div class="brand-sub">IP/UNIKIVI</div></div>
    </a>
        <nav class="sidebar-nav">
      <span class="sidebar-section-label">Principal</span>
      <a href="/dashboard.html"    class="sidebar-link"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a>
      <a href="/projects.html"     class="sidebar-link"><i class="bi bi-folder2-open"></i>Projectos</a>
      <a href="/startups.html"     class="sidebar-link"><i class="bi bi-rocket-takeoff"></i>Startups</a>
      <a href="/articles.html"     class="sidebar-link"><i class="bi bi-lightbulb-fill"></i>Artigos &amp; Ideias</a>
      <a href="/roadmap.html"      class="sidebar-link"><i class="bi bi-map-fill"></i>Roadmap</a>
      <a href="/classroom.html"    class="sidebar-link"><i class="bi bi-mortarboard-fill"></i>Classroom</a>
      <span class="sidebar-section-label">IA &amp; Ferramentas</span>
      <a href="/ai-assistant.html" class="sidebar-link"><i class="bi bi-robot"></i>INKU·AI Chat</a>
      <a href="/sandbox.html"      class="sidebar-link"><i class="bi bi-terminal-fill"></i>Sandbox IA</a>
      <a href="/ai-models.html"    class="sidebar-link"><i class="bi bi-braces"></i>Modelos IA</a>
      <a href="/datasets.html"     class="sidebar-link"><i class="bi bi-database-fill"></i>Datasets</a>
      <span class="sidebar-section-label">Conta</span>
      <a href="/messages.html"     class="sidebar-link"><i class="bi bi-chat-dots-fill"></i>Mensagens <span class="sidebar-badge msg-unread-badge" style="display:none">0</span></a>
      <a href="/profile.html"      class="sidebar-link"><i class="bi bi-person-fill"></i>Perfil</a>
      <a href="/mentorship.html"   class="sidebar-link"><i class="bi bi-people-fill"></i>Mentoria</a>
      <a href="/admin/admin-dashboard.html" class="sidebar-link" id="admin-link" style="display:none"><i class="bi bi-shield-fill"></i>Administração</a>
    </nav>
        <div class="sidebar-footer">
      <div class="sidebar-user" onclick="location.href='/profile.html'">
        <div class="sidebar-user-avatar" id="user-avatar">U</div>
        <div style="flex:1;overflow:hidden;"><div class="sidebar-user-name truncate" data-user-name>Utilizador</div><div class="sidebar-user-role" data-user-role>student</div></div>
        <button onclick="event.stopPropagation();doLogout()" class="btn btn-link p-0" style="color:rgba(255,255,255,0.3);" title="Sair"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <button id="sidebar-toggle" class="btn btn-link d-lg-none p-0 me-2" style="color:var(--text-muted)"><i class="bi bi-list fs-4"></i></button>
      <a href="/startups.html" class="btn btn-link p-0 me-2" style="color:var(--text-muted)"><i class="bi bi-arrow-left"></i></a>
      <span class="topbar-title" id="page-title">Detalhes da Startup</span>
      <div class="ms-auto d-flex align-items-center gap-2"><div id="notif-mount"></div></div>
    </div>
    <div class="page-content" id="startup-content">
      <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api/apiClient.js"></script>
<script src="/assets/js/components/toast.js"></script>
<script src="/assets/js/components/sidebar.js"></script>
<script>
const PALETTE = ['#1d4ed8','#16a34a','#7c3aed','#d97706','#dc2626','#0284c7'];
const PALE    = ['#dbeafe','#bbf7d0','#ddd6fe','#fde68a','#fecaca','#bae6fd'];

async function loadStartup() {
  const id = new URLSearchParams(window.location.search).get('id');
  if (!id) { window.location.href='/startups.html'; return; }
  try {
    const res = await window.InkuAPI.get(`/startups/${id}`);
    const s = res.startup;
    document.getElementById('page-title').textContent = s.name;
    const roleColor = {lead:'var(--blue-600)',developer:'var(--success)',researcher:'var(--info)',designer:'#7c3aed',analyst:'var(--warning)'};
    document.getElementById('startup-content').innerHTML = `
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="inkuai-card mb-4">
          <div class="d-flex align-items-center gap-3 mb-4">
            <div style="width:60px;height:60px;background:${PALE[0]};border:2px solid ${PALETTE[0]}40;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;color:${PALETTE[0]}">${s.name[0]}</div>
            <div>
              <div class="d-flex align-items-center gap-2 mb-1">
                <h4 style="font-weight:700;color:var(--text-primary);margin:0">${s.name}</h4>
                <span class="status status-${s.status}">${s.status}</span>
              </div>
              <div style="font-size:0.82rem;color:var(--text-muted)">${s.sector} · Criado em ${new Date(s.created_at).toLocaleDateString('pt-PT')}</div>
            </div>
          </div>
          <p style="color:var(--text-secondary);margin-bottom:20px">${s.description||'Sem descrição.'}</p>
          <div class="d-flex gap-2">
            ${s.github_url?`<a href="${s.github_url}" target="_blank" class="btn btn-sm btn-outline-secondary"><i class="bi bi-github me-1"></i>GitHub</a>`:''}
            ${s.website_url?`<a href="${s.website_url}" target="_blank" class="btn btn-sm btn-outline-primary"><i class="bi bi-globe me-1"></i>Website</a>`:''}
          </div>
        </div>

        <div class="inkuai-card">
          <h6 style="font-weight:700;color:var(--text-primary);margin-bottom:20px">
            <i class="bi bi-people-fill me-2" style="color:var(--blue-600)"></i>Equipa (${s.members?.length||0} membros)
          </h6>
          <div class="row g-3">
            ${(s.members||[]).map(m=>`
            <div class="col-sm-6">
              <div class="d-flex align-items-center gap-3 p-3 rounded-3" style="background:var(--bg-page);border:1px solid var(--border-light)">
                <div style="width:40px;height:40px;background:var(--blue-50);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--blue-600);font-size:0.9rem;flex-shrink:0">${m.user?.name?.[0]||'?'}</div>
                <div>
                  <div style="font-weight:600;color:var(--text-primary);font-size:0.875rem">${m.user?.name||'Membro'}</div>
                  <span class="badge" style="background:${roleColor[m.role_in_team]||'var(--blue-600)'}15;color:${roleColor[m.role_in_team]||'var(--blue-600)'};font-size:0.7rem">${m.role_in_team}</span>
                </div>
              </div>
            </div>`).join('')||'<div class="col-12"><p style="color:var(--text-muted);font-size:0.875rem">Sem membros registados.</p></div>'}
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="inkuai-card mb-4">
          <h6 style="font-weight:700;color:var(--text-primary);margin-bottom:16px"><i class="bi bi-info-circle me-2" style="color:var(--blue-600)"></i>Detalhes</h6>
          <div class="d-flex flex-column gap-2" style="font-size:0.875rem">
            <div class="d-flex justify-content-between py-2" style="border-bottom:1px solid var(--border-light)"><span style="color:var(--text-muted)">Estado</span><span class="status status-${s.status}">${s.status}</span></div>
            <div class="d-flex justify-content-between py-2" style="border-bottom:1px solid var(--border-light)"><span style="color:var(--text-muted)">Sector</span><span style="color:var(--text-primary);font-weight:600">${s.sector}</span></div>
            <div class="d-flex justify-content-between py-2" style="border-bottom:1px solid var(--border-light)"><span style="color:var(--text-muted)">Fundador</span><span style="color:var(--text-primary)">${s.owner?.name||'—'}</span></div>
            <div class="d-flex justify-content-between py-2"><span style="color:var(--text-muted)">Membros</span><span style="color:var(--text-primary)">${s.members?.length||0}</span></div>
          </div>
        </div>
        ${s.tags?.length?`
        <div class="inkuai-card">
          <h6 style="font-weight:700;color:var(--text-primary);margin-bottom:12px"><i class="bi bi-tags me-2" style="color:var(--success)"></i>Tags</h6>
          <div class="d-flex flex-wrap gap-2">${s.tags.map(t=>`<span class="badge" style="background:#f0fdf4;color:var(--success);font-size:0.78rem">#${t}</span>`).join('')}</div>
        </div>`:''}
      </div>
    </div>`;
  } catch(err) {
    document.getElementById('startup-content').innerHTML=`<div class="text-center py-5 text-danger"><i class="bi bi-exclamation-triangle fs-1 d-block mb-3"></i>${err.message}</div>`;
  }
}
const usr=window.InkuAuth?.getUser();
if(usr?.name) document.getElementById('user-avatar').textContent=usr.name[0].toUpperCase();
document.addEventListener('DOMContentLoaded', loadStartup);
</script>
<script src="/assets/js/components/notifications.js"></script>
<script src="/assets/js/components/mentor-ai.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — INKU·AI | IP/UNIKIVI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/main.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <!-- Logo -->
    <div class="text-center mb-4">
      <div class="auth-logo">
        <i class="bi bi-cpu-fill text-white fs-4"></i>
      </div>
      <h4 class="auth-title">INKU<span style="color:#2563eb">·AI</span></h4>
      <p class="auth-subtitle mt-1">Instituto Politécnico / UNIKIVI</p>
    </div>

    <h5 style="font-weight:600;color:var(--text-primary);margin-bottom:20px">Entrar na plataforma</h5>

    <form id="login-form">
      <div class="mb-3">
        <label class="form-label-dark">Email institucional</label>
        <div class="position-relative">
          <i class="bi bi-envelope position-absolute" style="left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted)"></i>
          <input type="email" id="email" class="form-control-dark" style="padding-left:38px" placeholder="exemplo@ip.unikivi.ao" required>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label-dark">Password</label>
        <div class="position-relative">
          <i class="bi bi-lock position-absolute" style="left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted)"></i>
          <input type="password" id="password" class="form-control-dark" style="padding-left:38px" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn-inkuai w-100 justify-content-center" style="height:44px">
        <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
      </button>
    </form>

    <div class="text-center mt-3">
      <a href="forgot-password.html" style="color:var(--text-muted);font-size:0.85rem;text-decoration:none">
        Esqueceu a password?
      </a>
    </div>

    <hr style="border-color:#e2e8f0;margin:20px 0">

    <p class="text-center mb-0" style="font-size:0.875rem;color:var(--text-muted)">
      Ainda não tem conta?
      <a href="register.html" style="color:#2563eb;font-weight:600;text-decoration:none">Criar conta</a>
    </p>
        <p class="text-center mb-0" style="font-size:0.875rem;color:var(--text-muted)">
      Voltar à página inicial?
      <a href="index.html" style="color:#2563eb;font-weight:600;text-decoration:none">Voltar</a>
    </p>

    </div>

</div>

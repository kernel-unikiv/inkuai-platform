<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — INKU·AI | IP/UNIKIVI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/main.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-5">
      <div class="auth-logo">
        <i class="bi bi-cpu-fill text-white" style="font-size:1.25rem"></i>
      </div>
      <h4 class="auth-title">INKU<span style="color:var(--ink-400)">·AI</span></h4>
      <p class="auth-subtitle">Instituto Politécnico / UNIKIVI</p>
    </div>

    <div style="margin-bottom:24px">
      <h5 style="font-size:1rem;font-weight:700;color:var(--text-primary);letter-spacing:-0.015em;margin-bottom:4px">
        Entrar na plataforma
      </h5>
      <p style="font-size:0.8125rem;color:var(--text-muted);margin:0">
        Use as suas credenciais institucionais
      </p>
    </div>

    <form id="login-form">
      <div class="mb-3">
        <label class="form-label-dark">Email institucional</label>
        <div class="input-group">
          <i class="bi bi-envelope input-icon"></i>
          <input type="email" id="email" class="form-control-dark"
                 placeholder="exemplo@ip.unikivi.ao" required autocomplete="email">
        </div>
      </div>
      <div class="mb-4">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">
          <label class="form-label-dark" style="margin-bottom:0">Password</label>
          <a href="forgot-password.html" style="font-size:0.75rem;color:var(--ink-400);text-decoration:none;font-weight:500">
            Esqueceu?
          </a>
        </div>
        <div class="input-group">
          <i class="bi bi-lock input-icon"></i>
          <input type="password" id="password" class="form-control-dark"
                 placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn-inkuai w-100 justify-content-center" style="height:42px;font-size:0.9rem">
        <i class="bi bi-box-arrow-in-right"></i>Entrar
      </button>
    </form>

    <div style="text-align:center;margin-top:20px;padding-top:20px;border-top:1px solid var(--border-subtle)">
      <p style="font-size:0.8125rem;color:var(--text-muted);margin-bottom:8px">
        Ainda não tem conta?
        <a href="register.html" style="color:var(--ink-400);font-weight:600;text-decoration:none">Criar conta</a>
      </p>
      <p style="font-size:0.8125rem;color:var(--text-muted);margin:0">
        <a href="index.html" style="color:var(--text-muted);text-decoration:none">
          <i class="bi bi-arrow-left me-1"></i>Voltar ao início
        </a>
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api/apiClient.js"></script>
<script src="/assets/js/components/toast.js"></script>
<script src="/assets/js/pages/auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensagens — INKU·AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/main.css" rel="stylesheet">
</head>
<body>
<div class="dashboard-layout">
  <aside class="sidebar">
    <a href="/dashboard.html" class="sidebar-brand">
      <div class="brand-logo"><i class="bi bi-cpu-fill"></i></div>
      <div><div class="brand-name">INKU<span style="color:#60a5fa">·AI</span></div><div class="brand-sub">IP/UNIKIVI</div></div>
    </a>
    <nav class="sidebar-nav">
      <span class="sidebar-section-label">Principal</span>
      <a href="/dashboard.html"  class="sidebar-link"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a>
      <a href="/projects.html"   class="sidebar-link"><i class="bi bi-folder2-open"></i>Projectos</a>
      <a href="/startups.html"   class="sidebar-link"><i class="bi bi-rocket-takeoff"></i>Startups</a>
      <a href="/sandbox.html"    class="sidebar-link"><i class="bi bi-terminal-fill"></i>Sandbox IA</a>
      <a href="/ai-models.html"  class="sidebar-link"><i class="bi bi-braces"></i>Modelos IA</a>
      <span class="sidebar-section-label">Académico</span>
      <a href="/mentorship.html" class="sidebar-link"><i class="bi bi-mortarboard-fill"></i>Mentoria</a>
      <a href="/datasets.html"   class="sidebar-link"><i class="bi bi-database-fill"></i>Datasets</a>
      <span class="sidebar-section-label">Conta</span>
      <a href="/messages.html"   class="sidebar-link active">
        <i class="bi bi-chat-dots-fill"></i>Mensagens
        <span id="sidebar-unread" class="badge bg-danger ms-auto" style="display:none;font-size:0.6rem">0</span>
      </a>
      <a href="/profile.html"    class="sidebar-link"><i class="bi bi-person-fill"></i>Perfil</a>
      <a href="/admin/admin-dashboard.html" class="sidebar-link" id="admin-link" style="display:none"><i class="bi bi-shield-fill"></i>Administração</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar" id="user-avatar">U</div>
        <div style="flex:1;overflow:hidden">
          <div class="sidebar-user-name text-truncate" data-user-name>Utilizador</div>
          <div class="sidebar-user-role" data-user-role>student</div>
        </div>
        <button onclick="doLogout()" class="btn btn-link p-0" style="color:rgba(255,255,255,0.4)"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <button id="sidebar-toggle" class="btn btn-link d-lg-none p-0 me-2" style="color:var(--text-muted)"><i class="bi bi-list fs-4"></i></button>
      <span class="topbar-title"><i class="bi bi-chat-dots-fill me-2" style="color:var(--blue-600)"></i>Mensagens</span>
      <div class="ms-auto">
        <span id="unread-count" class="badge" style="background:var(--blue-50);color:var(--blue-700)">0 não lidas</span>
      </div>
    </div>

    <div class="page-content">
      <div class="row g-4">

        <!-- Lista de mensagens -->
        <div class="col-lg-4">
          <!-- Abas -->
          <div class="d-flex gap-2 mb-3">
            <button id="tab-inbox" onclick="setTab('inbox')"
              class="btn btn-primary btn-sm flex-fill">
              <i class="bi bi-inbox me-1"></i>Recebidas
            </button>
            <button id="tab-sent" onclick="setTab('sent')"
              class="btn btn-outline-secondary btn-sm flex-fill">
              <i class="bi bi-send me-1"></i>Enviadas
            </button>
          </div>

          <!-- Lista -->
          <div class="inkuai-card" style="padding:0;overflow:hidden">
            <div id="msg-list" style="max-height:600px;overflow-y:auto">
              <div class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div></div>
            </div>
          </div>
        </div>

        <!-- Detalhe da mensagem seleccionada -->
        <div class="col-lg-8">
          <div class="inkuai-card" id="msg-detail" style="min-height:400px">
            <div class="text-center py-5" style="color:var(--text-muted)">
              <i class="bi bi-chat-dots fs-1 d-block mb-3" style="color:var(--blue-100)"></i>
              <p>Seleccione uma mensagem para ler</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api/apiClient.js"></script>
<script src="/assets/js/components/toast.js"></script>
<script src="/assets/js/components/sidebar.js"></script>
<script>
let currentTab = 'inbox';
let currentPage = 1;

function setTab(tab) {
  currentTab = tab;
  currentPage = 1;
  document.getElementById('tab-inbox').className = tab==='inbox'
    ? 'btn btn-primary btn-sm flex-fill'
    : 'btn btn-outline-secondary btn-sm flex-fill';
  document.getElementById('tab-sent').className = tab==='sent'
    ? 'btn btn-primary btn-sm flex-fill'
    : 'btn btn-outline-secondary btn-sm flex-fill';
  // Limpar detalhe
  document.getElementById('msg-detail').innerHTML = `
    <div class="text-center py-5" style="color:var(--text-muted)">
      <i class="bi bi-chat-dots fs-1 d-block mb-3" style="color:var(--blue-100)"></i>
      <p>Seleccione uma mensagem para ler</p>
    </div>`;
  loadMessages();
}

async function loadMessages(page=1) {
  currentPage = page;
  const list = document.getElementById('msg-list');
  list.innerHTML = '<div class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div></div>';
  try {
    const res = await window.InkuAPI.get(`/messages?type=${currentTab}&page=${page}&limit=20`);
    const msgs = res.data || [];
    const total = res.pagination?.total || 0;

    // Contar não lidas
    if (currentTab === 'inbox') {
      const unread = msgs.filter(m => !m.is_read).length;
      document.getElementById('unread-count').textContent = `${unread} não lidas`;
      const sb = document.getElementById('sidebar-unread');
      if (unread > 0) { sb.style.display = ''; sb.textContent = unread; }
      else { sb.style.display = 'none'; }
    }

    if (!msgs.length) {
      list.innerHTML = `
        <div class="text-center py-5" style="color:var(--text-muted)">
          <i class="bi bi-${currentTab==='inbox'?'inbox':'send'} fs-1 d-block mb-3" style="color:var(--blue-100)"></i>
          <p style="font-size:0.875rem">${currentTab==='inbox'?'Sem mensagens recebidas.':'Sem mensagens enviadas.'}</p>
        </div>`;
      return;
    }

    list.innerHTML = msgs.map(m => {
      const other = currentTab==='inbox' ? m.sender : m.receiver;
      const unread = currentTab==='inbox' && !m.is_read;
      const date = new Date(m.created_at);
      const dateStr = isToday(date)
        ? date.toLocaleTimeString('pt-PT', {hour:'2-digit',minute:'2-digit'})
        : date.toLocaleDateString('pt-PT', {day:'2-digit',month:'2-digit'});
      return `
        <div onclick="viewMessage(${JSON.stringify(m).replace(/'/g,"&#39;")})"
          class="msg-item d-flex align-items-start gap-3 p-3"
          style="cursor:pointer;border-bottom:1px solid var(--border-light);background:${unread?'var(--blue-50)':'transparent'};transition:background 0.15s"
          onmouseenter="this.style.background='${unread?'#dbeafe':'var(--bg-page)'}';"
          onmouseleave="this.style.background='${unread?'var(--blue-50)':'transparent'}';">
          <!-- Avatar -->
          <div style="width:38px;height:38px;border-radius:50%;background:var(--blue-50);border:1px solid var(--blue-100);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--blue-600);flex-shrink:0;font-size:0.9rem">
            ${(other?.name||'?')[0].toUpperCase()}
          </div>
          <div style="flex:1;overflow:hidden;min-width:0">
            <div class="d-flex align-items-center gap-1">
              <span style="font-weight:${unread?'700':'500'};color:var(--text-primary);font-size:0.875rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1">${other?.name||'—'}</span>
              <span style="font-size:0.72rem;color:var(--text-muted);white-space:nowrap;flex-shrink:0">${dateStr}</span>
            </div>
            <div style="font-size:0.82rem;color:${unread?'var(--text-primary)':'var(--text-muted)'};font-weight:${unread?'600':'400'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
              ${m.subject||'Sem assunto'}
            </div>
            <div style="font-size:0.78rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
              ${m.body?.substring(0,60)||''}...
            </div>
          </div>
          ${unread?'<div style="width:8px;height:8px;border-radius:50%;background:var(--blue-600);flex-shrink:0;margin-top:6px"></div>':''}
        </div>`;
    }).join('');

    // Paginação na lista
    if (res.pagination?.pages > 1) {
      list.innerHTML += `<div class="d-flex justify-content-center gap-1 p-3">
        ${Array.from({length:res.pagination.pages},(_,i)=>`
          <button class="btn btn-sm ${i+1===page?'btn-primary':'btn-outline-secondary'}" onclick="loadMessages(${i+1})">${i+1}</button>`).join('')}
      </div>`;
    }
  } catch(err) { window.showToast?.(err.message,'error'); }
}

function isToday(date) {
  const today = new Date();
  return date.getDate()===today.getDate() && date.getMonth()===today.getMonth() && date.getFullYear()===today.getFullYear();
}

async function viewMessage(m) {
  // Marcar como lida
  if (currentTab==='inbox' && !m.is_read) {
    window.InkuAPI.patch(`/messages/${m.id}/read`).then(loadMessages).catch(()=>{});
  }

  const other = currentTab==='inbox' ? m.sender : m.receiver;
  const date  = new Date(m.created_at).toLocaleString('pt-PT');

  document.getElementById('msg-detail').innerHTML = `
    <!-- Cabeçalho -->
    <div class="d-flex align-items-start gap-3 mb-4 pb-4" style="border-bottom:1px solid var(--border-light)">
      <div style="width:48px;height:48px;border-radius:50%;background:var(--blue-50);border:1px solid var(--blue-100);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--blue-600);font-size:1.1rem;flex-shrink:0">
        ${(other?.name||'?')[0].toUpperCase()}
      </div>
      <div style="flex:1">
        <h5 style="font-weight:700;color:var(--text-primary);margin-bottom:4px">${m.subject||'Sem assunto'}</h5>
        <div style="font-size:0.85rem;color:var(--text-muted)">
          <strong style="color:var(--text-secondary)">${currentTab==='inbox'?'De':'Para'}:</strong>
          ${other?.name||'—'}
          <span style="font-size:0.78rem;margin-left:6px;padding:1px 8px;background:var(--blue-50);color:var(--blue-700);border-radius:10px">${other?.role||''}</span>
        </div>
        <div style="font-size:0.78rem;color:var(--text-muted);margin-top:2px">
          <i class="bi bi-clock me-1"></i>${date}
        </div>
      </div>
      ${m.context_type?`
        <span class="badge" style="background:var(--blue-50);color:var(--blue-700);font-size:0.72rem">
          <i class="bi bi-${m.context_type==='project'?'folder':'rocket'} me-1"></i>${m.context_type}
        </span>`:''}
    </div>

    <!-- Corpo -->
    <div style="color:var(--text-primary);line-height:1.8;white-space:pre-wrap;font-size:0.9rem;margin-bottom:32px">${m.body||''}</div>

    <!-- Responder (se recebida) -->
    ${currentTab==='inbox'?`
    <div style="border-top:1px solid var(--border-light);padding-top:20px">
      <h6 style="font-weight:700;color:var(--text-primary);margin-bottom:12px">
        <i class="bi bi-reply me-2" style="color:var(--blue-600)"></i>Responder
      </h6>
      <textarea id="reply-body" class="form-control-dark mb-3" rows="4"
        placeholder="Escreva a sua resposta..."></textarea>
      <button onclick="sendReply('${m.sender_id}','${(m.subject||'').replace(/'/g,"\\'")}',)"
        class="btn-inkuai">
        <i class="bi bi-send me-2"></i>Enviar Resposta
      </button>
    </div>`:``}`;
}

async function sendReply(receiverId, originalSubject) {
  const body = document.getElementById('reply-body')?.value?.trim();
  if (!body) { window.showToast?.('Escreva uma mensagem antes de enviar.','warning'); return; }
  const btn = document.querySelector('button[onclick^="sendReply"]');
  if (btn) { btn.disabled=true; btn.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>A enviar...'; }
  try {
    await window.InkuAPI.post('/messages', {
      receiver_id: receiverId,
      subject: `Re: ${originalSubject}`,
      body
    });
    window.showToast?.('Resposta enviada!','success');
    document.getElementById('msg-detail').innerHTML = `
      <div class="text-center py-5" style="color:var(--text-muted)">
        <i class="bi bi-check-circle-fill fs-1 d-block mb-3" style="color:var(--success)"></i>
        <p>Resposta enviada com sucesso!</p>
      </div>`;
    loadMessages();
  } catch(err) { window.showToast?.(err.message,'error'); }
  finally { if(btn){ btn.disabled=false; btn.innerHTML='<i class="bi bi-send me-2"></i>Enviar Resposta'; } }
}

// Init
const usr = window.InkuAuth?.getUser();
if (!usr) { window.location.href='/login.html'; }
if (usr?.name) document.getElementById('user-avatar').textContent = usr.name[0].toUpperCase();
if (['admin','mentor'].includes(usr?.role)) document.getElementById('admin-link').style.display='';
document.addEventListener('DOMContentLoaded', loadMessages);
</script>
</body>
</html>

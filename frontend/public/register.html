<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta — INKU·AI | IP/UNIKIVI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/main.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card" style="max-width:480px">
    <div class="text-center mb-4">
      <div class="auth-logo">
        <i class="bi bi-cpu-fill text-white" style="font-size:1.25rem"></i>
      </div>
      <h4 class="auth-title">INKU<span style="color:var(--ink-400)">·AI</span></h4>
      <p class="auth-subtitle">Criar conta na incubadora</p>
    </div>

    <div style="margin-bottom:22px">
      <h5 style="font-size:1rem;font-weight:700;color:var(--text-primary);letter-spacing:-0.015em;margin-bottom:4px">
        Criar conta
      </h5>
      <p style="font-size:0.8125rem;color:var(--text-muted);margin:0">
        Preencha os seus dados para começar
      </p>
    </div>

    <form id="register-form">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label-dark">Nome completo *</label>
          <input type="text" id="name" class="form-control-dark"
                 placeholder="João Manuel Silva" required autocomplete="name">
        </div>
        <div class="col-12">
          <label class="form-label-dark">Email institucional *</label>
          <div class="input-group">
            <i class="bi bi-envelope input-icon"></i>
            <input type="email" id="email" class="form-control-dark"
                   placeholder="joao@ip.unikivi.ao" required autocomplete="email">
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label-dark">Password *</label>
          <div class="input-group">
            <i class="bi bi-lock input-icon"></i>
            <input type="password" id="password" class="form-control-dark"
                   placeholder="Mínimo 8 caracteres" required minlength="8" autocomplete="new-password">
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label-dark">Confirmar *</label>
          <div class="input-group">
            <i class="bi bi-lock-fill input-icon"></i>
            <input type="password" id="confirm-password" class="form-control-dark"
                   placeholder="Repetir password" required autocomplete="new-password">
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label-dark">Papel</label>
          <select id="role" class="form-control-dark">
            <option value="student">Estudante / Bolseiro</option>
            <option value="researcher">Investigador</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label-dark">Instituição</label>
          <input type="text" id="institution" class="form-control-dark" value="IP/UNIKIVI">
        </div>
      </div>

      <button type="submit" class="btn-inkuai w-100 justify-content-center mt-4" style="height:42px;font-size:0.9rem">
        <i class="bi bi-person-plus-fill"></i>Criar Conta
      </button>
    </form>

    <div style="text-align:center;margin-top:20px;padding-top:20px;border-top:1px solid var(--border-subtle)">
      <p style="font-size:0.8125rem;color:var(--text-muted);margin:0">
        Já tem conta?
        <a href="login.html" style="color:var(--ink-400);font-weight:600;text-decoration:none">Entrar</a>
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api/apiClient.js"></script>
<script src="/assets/js/components/toast.js"></script>
<script src="/assets/js/pages/auth.js"></script>
</body>
</html>

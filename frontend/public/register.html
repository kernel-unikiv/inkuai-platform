<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta — INKU·AI | IP/UNIKIVI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/tokens.css" rel="stylesheet">
  <link href="/assets/css/main.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card" style="max-width:500px">
    <div class="text-center mb-4">
      <div class="auth-logo">
        <i class="bi bi-cpu-fill text-white fs-4"></i>
      </div>
      <h4 class="auth-title">INKU<span style="color:var(--blue-600)">·AI</span></h4>
      <p class="auth-subtitle mt-1">Criar conta na incubadora</p>
    </div>

    <form id="register-form">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label-dark">Nome completo *</label>
          <input type="text" id="name" class="form-control-dark" placeholder="João Manuel Silva" required>
        </div>
        <div class="col-12">
          <label class="form-label-dark">Email institucional *</label>
          <input type="email" id="email" class="form-control-dark" placeholder="joao@ip.unikivi.ao" required>
        </div>
        <div class="col-md-6">
          <label class="form-label-dark">Password *</label>
          <input type="password" id="password" class="form-control-dark" placeholder="Mínimo 8 caracteres" required minlength="8">
        </div>
        <div class="col-md-6">
          <label class="form-label-dark">Confirmar *</label>
          <input type="password" id="confirm-password" class="form-control-dark" placeholder="Repetir password" required>
        </div>
        <div class="col-md-6">
          <label class="form-label-dark">Papel</label>
          <select id="role" class="form-control-dark">
            <option value="student">Estudante / Bolseiro</option>
            <option value="researcher">Investigador</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label-dark">Instituição</label>
          <input type="text" id="institution" class="form-control-dark" value="IP/UNIKIVI">
        </div>
      </div>

      <button type="submit" class="btn-inkuai w-100 justify-content-center mt-4" style="height:44px">
        <i class="bi bi-person-plus me-2"></i>Criar Conta
      </button>
    </form>

    <hr style="border-color:var(--border-light);margin:20px 0">
    <p class="text-center mb-0" style="font-size:0.875rem;color:var(--text-muted)">
      Já tem conta?
      <a href="login.html" style="color:var(--blue-600);font-weight:600;text-decoration:none">Entrar</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api/apiClient.js"></script>
<script src="/assets/js/components/toast.js"></script>
<script src="/assets/js/pages/auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil — INKU·AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/main.css" rel="stylesheet">
</head>
<body>
<div class="dashboard-layout">
  <aside class="sidebar">
    <a href="/dashboard.html" class="sidebar-brand">
      <div class="brand-logo"><i class="bi bi-cpu-fill"></i></div>
      <div><div class="brand-name">INKU<span style="color:#60a5fa">·AI</span></div><div class="brand-sub">IP/UNIKIVI</div></div>
    </a>
    <nav class="sidebar-nav">
      <span class="sidebar-section-label">Principal</span>
      <a href="/dashboard.html"  class="sidebar-link"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a>
      <a href="/projects.html"   class="sidebar-link"><i class="bi bi-folder2-open"></i>Projectos</a>
      <a href="/startups.html"   class="sidebar-link"><i class="bi bi-rocket-takeoff"></i>Startups</a>
      <a href="/sandbox.html"    class="sidebar-link"><i class="bi bi-terminal-fill"></i>Sandbox IA</a>
      <a href="/ai-models.html"  class="sidebar-link"><i class="bi bi-braces"></i>Modelos IA</a>
      <span class="sidebar-section-label">Académico</span>
      <a href="/mentorship.html" class="sidebar-link"><i class="bi bi-mortarboard-fill"></i>Mentoria</a>
      <a href="/datasets.html"   class="sidebar-link"><i class="bi bi-database-fill"></i>Datasets</a>
      <span class="sidebar-section-label">Conta</span>
      <a href="/profile.html"    class="sidebar-link active"><i class="bi bi-person-fill"></i>Perfil</a>
      <a href="/admin/admin-dashboard.html" class="sidebar-link" id="admin-link" style="display:none"><i class="bi bi-shield-fill"></i>Administração</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar" id="user-avatar">U</div>
        <div style="flex:1;overflow:hidden"><div class="sidebar-user-name text-truncate" data-user-name>Utilizador</div><div class="sidebar-user-role" data-user-role>student</div></div>
        <button onclick="doLogout()" class="btn btn-link p-0" style="color:rgba(255,255,255,0.4)"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <button id="sidebar-toggle" class="btn btn-link d-lg-none p-0 me-2" style="color:var(--text-muted)"><i class="bi bi-list fs-4"></i></button>
      <span class="topbar-title">Perfil</span>
    </div>
    <div class="page-content">
      <div class="row g-4">
        <!-- Card perfil -->
        <div class="col-lg-4">
          <div class="inkuai-card text-center">
            <div id="avatar-circle" style="width:80px;height:80px;background:var(--blue-600);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:#fff;margin:0 auto 16px">U</div>
            <h5 style="font-weight:700;color:var(--text-primary);margin-bottom:4px" id="profile-name">—</h5>
            <span class="badge mb-2" style="background:var(--blue-50);color:var(--blue-700)" id="profile-role">—</span>
            <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:12px" id="profile-institution">—</p>
            <div class="d-flex justify-content-center gap-3 mb-3">
              <a href="#" id="profile-github" class="text-decoration-none" style="font-size:0.82rem;color:var(--text-muted);display:none"><i class="bi bi-github me-1"></i>GitHub</a>
              <a href="#" id="profile-orcid"  class="text-decoration-none" style="font-size:0.82rem;color:var(--text-muted);display:none"><i class="bi bi-person-badge me-1"></i>ORCID</a>
            </div>
            <p style="font-size:0.875rem;color:var(--text-secondary)" id="profile-bio">Sem biografia.</p>
          </div>
        </div>

        <!-- Editar perfil -->
        <div class="col-lg-8">
          <div class="inkuai-card">
            <h6 style="font-weight:700;color:var(--text-primary);margin-bottom:24px">
              <i class="bi bi-pencil-square me-2" style="color:var(--blue-600)"></i>Editar Perfil
            </h6>
            <form id="profile-form">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label-dark">Nome completo</label>
                  <input type="text" id="f-name" class="form-control-dark" placeholder="Nome completo">
                </div>
                <div class="col-md-6">
                  <label class="form-label-dark">Instituição</label>
                  <input type="text" id="f-institution" class="form-control-dark" placeholder="IP/UNIKIVI">
                </div>
                <div class="col-md-6">
                  <label class="form-label-dark">Username GitHub</label>
                  <div class="position-relative">
                    <span class="position-absolute" style="left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:0.85rem">@</span>
                    <input type="text" id="f-github" class="form-control-dark" style="padding-left:28px" placeholder="nome-usuario">
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label-dark">ORCID ID</label>
                  <input type="text" id="f-orcid" class="form-control-dark" placeholder="0000-0000-0000-0000">
                </div>
                <div class="col-12">
                  <label class="form-label-dark">Biografia</label>
                  <textarea id="f-bio" class="form-control-dark" rows="4" placeholder="Investigo em IA aplicada ao contexto angolano..."></textarea>
                </div>
              </div>
              <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn-inkuai"><i class="bi bi-save me-2"></i>Guardar Alterações</button>
                <button type="button" onclick="loadProfile()" class="btn-outline-inkuai">Cancelar</button>
              </div>
            </form>
          </div>

          <!-- Segurança -->
          <div class="inkuai-card mt-4">
            <h6 style="font-weight:700;color:var(--text-primary);margin-bottom:16px">
              <i class="bi bi-shield-lock me-2" style="color:var(--success)"></i>Segurança
            </h6>
            <div class="d-flex align-items-center justify-content-between p-3 rounded-3" style="background:var(--bg-page);border:1px solid var(--border-light)">
              <div>
                <div style="font-weight:600;color:var(--text-primary);font-size:0.875rem">Password</div>
                <div style="font-size:0.8rem;color:var(--text-muted)">Última alteração: desconhecido</div>
              </div>
              <a href="/forgot-password.html" class="btn btn-sm btn-outline-primary">Alterar Password</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api/apiClient.js"></script>
<script src="/assets/js/components/toast.js"></script>
<script src="/assets/js/components/sidebar.js"></script>
<script>
let userId;
async function loadProfile() {
  if (!window.InkuAuth?.getToken()) { window.location.href='/login.html'; return; }
  try {
    const res = await window.InkuAPI.get('/auth/me');
    const u = res.user; userId = u.id;
    document.getElementById('profile-name').textContent        = u.name;
    document.getElementById('profile-role').textContent        = u.role;
    document.getElementById('profile-institution').textContent = u.institution||'IP/UNIKIVI';
    document.getElementById('profile-bio').textContent         = u.bio||'Sem biografia.';
    document.getElementById('avatar-circle').textContent       = u.name[0].toUpperCase();
    document.getElementById('user-avatar').textContent         = u.name[0].toUpperCase();
    if (u.github_username) {
      const el = document.getElementById('profile-github');
      el.style.display=''; el.href=`https://github.com/${u.github_username}`;
    }
    if (u.orcid_id) {
      const el = document.getElementById('profile-orcid');
      el.style.display=''; el.href=`https://orcid.org/${u.orcid_id}`;
    }
    document.getElementById('f-name').value        = u.name||'';
    document.getElementById('f-institution').value = u.institution||'';
    document.getElementById('f-github').value      = u.github_username||'';
    document.getElementById('f-orcid').value       = u.orcid_id||'';
    document.getElementById('f-bio').value         = u.bio||'';
    if(u.role==='admin') document.getElementById('admin-link').style.display='';
  } catch(err) { window.showToast?.(err.message,'error'); }
}

document.getElementById('profile-form')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('[type=submit]');
  btn.disabled=true; btn.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>A guardar...';
  try {
    await window.InkuAPI.put(`/users/${userId}`, {
      name: document.getElementById('f-name').value,
      institution: document.getElementById('f-institution').value,
      github_username: document.getElementById('f-github').value,
      orcid_id: document.getElementById('f-orcid').value,
      bio: document.getElementById('f-bio').value,
    });
    window.showToast?.('Perfil actualizado com sucesso!','success');
    loadProfile();
  } catch(err) { window.showToast?.(err.message,'error'); }
  finally { btn.disabled=false; btn.innerHTML='<i class="bi bi-save me-2"></i>Guardar Alterações'; }
});

document.addEventListener('DOMContentLoaded', loadProfile);
</script>
</body>
</html>

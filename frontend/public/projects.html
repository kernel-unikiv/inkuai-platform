<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projectos — INKU·AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/main.css" rel="stylesheet">
</head>
<body>
<div class="dashboard-layout">
  <aside class="sidebar">
    <a href="/dashboard.html" class="sidebar-brand">
      <div class="brand-logo"><i class="bi bi-cpu-fill"></i></div>
      <div><div class="brand-name">INKU<span style="color:#60a5fa">·AI</span></div><div class="brand-sub">IP/UNIKIVI</div></div>
    </a>
    <nav class="sidebar-nav">
      <span class="sidebar-section-label">Principal</span>
      <a href="/dashboard.html"  class="sidebar-link"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a>
      <a href="/projects.html"   class="sidebar-link active"><i class="bi bi-folder2-open"></i>Projectos</a>
      <a href="/startups.html"   class="sidebar-link"><i class="bi bi-rocket-takeoff"></i>Startups</a>
      <a href="/sandbox.html"    class="sidebar-link"><i class="bi bi-terminal-fill"></i>Sandbox IA</a>
      <a href="/ai-models.html"  class="sidebar-link"><i class="bi bi-braces"></i>Modelos IA</a>
      <span class="sidebar-section-label">Académico</span>
      <a href="/mentorship.html" class="sidebar-link"><i class="bi bi-mortarboard-fill"></i>Mentoria</a>
      <a href="/datasets.html"   class="sidebar-link"><i class="bi bi-database-fill"></i>Datasets</a>
      <span class="sidebar-section-label">Conta</span>
      <a href="/messages.html"   class="sidebar-link" id="msg-nav-link"><i class="bi bi-chat-dots-fill"></i>Mensagens <span class="badge bg-danger ms-auto msg-unread-badge" style="display:none;font-size:0.6rem">0</span></a>
      <a href="/profile.html"    class="sidebar-link"><i class="bi bi-person-fill"></i>Perfil</a>
      <a href="/admin/admin-dashboard.html" class="sidebar-link" id="admin-link" style="display:none"><i class="bi bi-shield-fill"></i>Administração</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar" id="user-avatar">U</div>
        <div style="flex:1;overflow:hidden">
          <div class="sidebar-user-name text-truncate" data-user-name>Utilizador</div>
          <div class="sidebar-user-role" data-user-role>student</div>
        </div>
        <button onclick="doLogout()" class="btn btn-link p-0" style="color:rgba(255,255,255,0.4)"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <button id="sidebar-toggle" class="btn btn-link d-lg-none p-0 me-2" style="color:var(--text-muted)"><i class="bi bi-list fs-4"></i></button>
      <span class="topbar-title">Projectos</span>
      <div class="ms-auto">
        <button class="btn-inkuai" data-bs-toggle="modal" data-bs-target="#newProjectModal">
          <i class="bi bi-plus-lg me-2"></i>Novo Projecto
        </button>
      </div>
    </div>

    <div class="page-content">
      <!-- Filtros -->
      <div class="inkuai-card mb-4">
        <div class="row g-3 align-items-end">
          <div class="col-md-5">
            <label class="form-label-dark">Pesquisar</label>
            <div class="position-relative">
              <i class="bi bi-search position-absolute" style="left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted)"></i>
              <input type="text" id="search-input" class="form-control-dark" style="padding-left:36px" placeholder="Nome do projecto...">
            </div>
          </div>
          <div class="col-md-3">
            <label class="form-label-dark">Estado</label>
            <select id="status-filter" class="form-control-dark">
              <option value="">Todos</option>
              <option value="draft">Rascunho</option>
              <option value="submitted">Submetido</option>
              <option value="approved">Aprovado</option>
              <option value="in_progress">Em Progresso</option>
              <option value="completed">Concluído</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label-dark">Tipo</label>
            <select id="type-filter" class="form-control-dark">
              <option value="">Todos</option>
              <option value="software">Software</option>
              <option value="ai_model">Modelo IA</option>
              <option value="data_pipeline">Pipeline Dados</option>
              <option value="research">Investigação</option>
            </select>
          </div>
          <div class="col-md-1">
            <button onclick="loadProjects(1)" class="btn btn-primary w-100"><i class="bi bi-search"></i></button>
          </div>
        </div>
      </div>

      <!-- Grid -->
      <div id="projects-grid" class="row g-3">
        <div class="col-12 text-center py-5" style="color:var(--text-muted)">
          <div class="spinner-border text-primary me-2"></div>A carregar projectos...
        </div>
      </div>
      <div id="pagination" class="d-flex justify-content-center gap-2 mt-4"></div>
    </div>
  </main>
</div>

<!-- Modal Novo Projecto -->
<div class="modal fade" id="newProjectModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-folder-plus me-2" style="color:var(--blue-600)"></i>Novo Projecto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label-dark">Título *</label>
            <input type="text" id="proj-title" class="form-control-dark" placeholder="Ex: Sistema de Detecção de Doenças com CNN">
          </div>
          <div class="col-md-6">
            <label class="form-label-dark">Tipo *</label>
            <select id="proj-type" class="form-control-dark">
              <option value="software">Software</option>
              <option value="ai_model">Modelo IA/ML</option>
              <option value="data_pipeline">Pipeline de Dados</option>
              <option value="research">Investigação Científica</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label-dark">GitHub (opcional)</label>
            <input type="url" id="proj-github" class="form-control-dark" placeholder="https://github.com/usuario/repo">
          </div>
          <div class="col-12">
            <label class="form-label-dark">Descrição *</label>
            <textarea id="proj-desc" class="form-control-dark" rows="4" placeholder="Descreva os objectivos, tecnologias e impacto esperado..."></textarea>
          </div>
          <div class="col-12">
            <label class="form-label-dark">Stack Tecnológico (separado por vírgulas)</label>
            <input type="text" id="proj-stack" class="form-control-dark" placeholder="Python, TensorFlow, React, Docker...">
          </div>
          <div class="col-12">
            <div class="form-check">
              <input type="checkbox" id="proj-public" class="form-check-input">
              <label for="proj-public" class="form-check-label" style="color:var(--text-secondary);font-size:0.875rem">
                Tornar projecto público na plataforma
              </label>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn-inkuai" id="save-project-btn"><i class="bi bi-save me-2"></i>Criar Projecto</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api/apiClient.js"></script>
<script src="/assets/js/components/toast.js"></script>
<script src="/assets/js/components/sidebar.js"></script>
<script>
const typeIcon  = {software:'bi-code-slash',ai_model:'bi-braces',data_pipeline:'bi-database',research:'bi-journal-text'};
const typeColor = {software:'primary',ai_model:'success',data_pipeline:'warning',research:'info'};
const typeBg    = {software:'var(--blue-50)',ai_model:'#f0fdf4',data_pipeline:'#fff7ed',research:'#f0f9ff'};
const typeClr   = {software:'var(--blue-700)',ai_model:'#16a34a',data_pipeline:'#d97706',research:'#0284c7'};

async function loadProjects(page=1) {
  const search = document.getElementById('search-input').value;
  const status = document.getElementById('status-filter').value;
  const type   = document.getElementById('type-filter').value;
  const grid   = document.getElementById('projects-grid');
  grid.innerHTML = '<div class="col-12 text-center py-5" style="color:var(--text-muted)"><div class="spinner-border text-primary me-2"></div>A carregar...</div>';
  try {
    let ep = `/projects?page=${page}&limit=9`;
    if (search) ep += `&search=${encodeURIComponent(search)}`;
    if (status) ep += `&status=${status}`;
    if (type)   ep += `&type=${type}`;
    const res = await window.InkuAPI.get(ep);
    const projects = res.data || [];
    if (!projects.length) {
      grid.innerHTML = '<div class="col-12 text-center py-5"><i class="bi bi-folder2 fs-1 d-block mb-3" style="color:var(--text-muted)"></i><p style="color:var(--text-muted)">Nenhum projecto encontrado.</p><button onclick="document.getElementById(\'newProjectModal\').querySelector(\'[data-bs-toggle]\') || bootstrap.Modal.getOrCreateInstance(document.getElementById(\'newProjectModal\')).show()" class="btn-inkuai">Criar primeiro projecto</button></div>';
      return;
    }
    grid.innerHTML = projects.map(p => `
      <div class="col-md-6 col-xl-4">
        <div class="project-card">
          <div class="d-flex align-items-start justify-content-between mb-3">
            <div class="project-type-icon" style="background:${typeBg[p.type]||'var(--blue-50)'}">
              <i class="bi ${typeIcon[p.type]||'bi-folder'}" style="color:${typeClr[p.type]||'var(--blue-600)'}"></i>
            </div>
            <span class="status status-${p.status}">${p.status}</span>
          </div>
          <h6 style="font-weight:700;color:var(--text-primary);margin-bottom:8px">${p.title}</h6>
          <p style="font-size:0.82rem;color:var(--text-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px">${p.description||'Sem descrição.'}</p>
          ${p.github_repo_url?`<a href="${p.github_repo_url}" target="_blank" class="d-flex align-items-center gap-1 mb-2 text-decoration-none" style="font-size:0.78rem;color:var(--text-muted)"><i class="bi bi-github"></i> GitHub</a>`:''}
          <div class="d-flex align-items-center justify-content-between pt-2" style="border-top:1px solid var(--border-light)">
            <span style="font-size:0.75rem;color:var(--text-muted)">${new Date(p.created_at).toLocaleDateString('pt-PT')}</span>
            <div class="d-flex gap-1">
              <a href="/sandbox.html?project=${p.id}" class="btn btn-sm btn-outline-success py-1" title="Sandbox"><i class="bi bi-terminal"></i></a>
              <a href="/project-detail.html?id=${p.id}" class="btn btn-sm btn-primary py-1">Ver</a>
            </div>
          </div>
        </div>
      </div>`).join('');

    if (res.pagination?.pages > 1) {
      document.getElementById('pagination').innerHTML = Array.from({length:res.pagination.pages},(_,i)=>`
        <button class="btn btn-sm ${i+1===page?'btn-primary':'btn-outline-secondary'}" onclick="loadProjects(${i+1})">${i+1}</button>`).join('');
    }
  } catch(err) {
    grid.innerHTML = `<div class="col-12 text-center py-5 text-danger"><i class="bi bi-exclamation-triangle fs-1 d-block mb-3"></i>${err.message}</div>`;
  }
}

document.getElementById('save-project-btn')?.addEventListener('click', async () => {
  const btn = document.getElementById('save-project-btn');
  btn.disabled=true; btn.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>A criar...';
  try {
    const stack = document.getElementById('proj-stack').value.split(',').map(s=>s.trim()).filter(Boolean);
    await window.InkuAPI.post('/projects',{
      title: document.getElementById('proj-title').value,
      description: document.getElementById('proj-desc').value,
      type: document.getElementById('proj-type').value,
      github_repo_url: document.getElementById('proj-github').value||null,
      tech_stack: stack,
      is_public: document.getElementById('proj-public').checked
    });
    bootstrap.Modal.getInstance(document.getElementById('newProjectModal')).hide();
    window.showToast?.('Projecto criado!','success');
    loadProjects();
  } catch(err){ window.showToast?.(err.message,'error'); }
  finally{ btn.disabled=false; btn.innerHTML='<i class="bi bi-save me-2"></i>Criar Projecto'; }
});

document.getElementById('search-input')?.addEventListener('keyup', e => { if(e.key==='Enter') loadProjects(1); });
document.getElementById('status-filter')?.addEventListener('change', ()=>loadProjects(1));
document.getElementById('type-filter')?.addEventListener('change', ()=>loadProjects(1));

const usr = window.InkuAuth?.getUser();
if(usr?.role==='admin') document.getElementById('admin-link').style.display='';
if(usr?.name) document.getElementById('user-avatar').textContent=usr.name[0].toUpperCase();

document.addEventListener('DOMContentLoaded', ()=>loadProjects());
</script>
<script src="/assets/js/components/notifications.js"></script>
</body>
</html>

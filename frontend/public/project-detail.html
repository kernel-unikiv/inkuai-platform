<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projecto — INKU·AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/main.css" rel="stylesheet">
</head>
<body>
<div class="dashboard-layout">
  <aside class="sidebar">
    <a href="/dashboard.html" class="sidebar-brand">
      <div class="brand-logo"><i class="bi bi-cpu-fill"></i></div>
      <div><div class="brand-name">INKU<span style="color:#60a5fa">·AI</span></div><div class="brand-sub">IP/UNIKIVI</div></div>
    </a>
    <nav class="sidebar-nav">
      <a href="/dashboard.html"  class="sidebar-link"><i class="bi bi-grid-1x2-fill"></i>Dashboard</a>
      <a href="/projects.html"   class="sidebar-link active"><i class="bi bi-folder2-open"></i>Projectos</a>
      <a href="/startups.html"   class="sidebar-link"><i class="bi bi-rocket-takeoff"></i>Startups</a>
      <a href="/sandbox.html"    class="sidebar-link"><i class="bi bi-terminal-fill"></i>Sandbox IA</a>
      <a href="/ai-models.html"  class="sidebar-link"><i class="bi bi-braces"></i>Modelos IA</a>
      <a href="/mentorship.html" class="sidebar-link"><i class="bi bi-mortarboard-fill"></i>Mentoria</a>
      <a href="/datasets.html"   class="sidebar-link"><i class="bi bi-database-fill"></i>Datasets</a>
      <a href="/profile.html"    class="sidebar-link"><i class="bi bi-person-fill"></i>Perfil</a>
      <a href="/admin/admin-dashboard.html" class="sidebar-link" id="admin-link" style="display:none"><i class="bi bi-shield-fill"></i>Administração</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar" id="user-avatar">U</div>
        <div style="flex:1;overflow:hidden"><div class="sidebar-user-name text-truncate" data-user-name>Utilizador</div><div class="sidebar-user-role" data-user-role>student</div></div>
        <button onclick="doLogout()" class="btn btn-link p-0" style="color:rgba(255,255,255,0.4)"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <button id="sidebar-toggle" class="btn btn-link d-lg-none p-0 me-2" style="color:var(--text-muted)"><i class="bi bi-list fs-4"></i></button>
      <a href="/projects.html" class="btn btn-link p-0 me-2" style="color:var(--text-muted)"><i class="bi bi-arrow-left"></i></a>
      <span class="topbar-title" id="page-title">Detalhes do Projecto</span>
      <div class="ms-auto d-flex gap-2" id="action-btns"></div>
    </div>
    <div class="page-content" id="project-content">
      <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api/apiClient.js"></script>
<script src="/assets/js/components/toast.js"></script>
<script src="/assets/js/components/sidebar.js"></script>
<script>
async function loadProject() {
  const id = new URLSearchParams(window.location.search).get('id');
  if (!id) { window.location.href='/projects.html'; return; }
  try {
    const res = await window.InkuAPI.get(`/projects/${id}`);
    const p = res.project;
    const me = window.InkuAuth?.getUser();
    const isOwner = me?.id === p.created_by || ['admin','mentor'].includes(me?.role);
    document.getElementById('page-title').textContent = p.title;

    const ab = document.getElementById('action-btns');
    if (isOwner && p.status==='draft')
      ab.innerHTML += `<button onclick="submitProject('${p.id}')" class="btn btn-sm btn-primary"><i class="bi bi-send me-1"></i>Submeter</button>`;
    if (['admin','mentor'].includes(me?.role) && p.status==='submitted')
      ab.innerHTML += `<button onclick="approveProject('${p.id}')" class="btn btn-sm btn-success"><i class="bi bi-check-lg me-1"></i>Aprovar</button>`;
    ab.innerHTML += `<a href="/sandbox.html?project=${p.id}" class="btn btn-sm btn-outline-success"><i class="bi bi-terminal me-1"></i>Sandbox</a>`;

    const typeColor = {software:'var(--blue-600)',ai_model:'var(--success)',data_pipeline:'var(--warning)',research:'var(--info)'};
    const typeBg    = {software:'var(--blue-50)',ai_model:'#f0fdf4',data_pipeline:'#fff7ed',research:'#f0f9ff'};
    const typeIcon  = {software:'bi-code-slash',ai_model:'bi-braces',data_pipeline:'bi-database',research:'bi-journal-text'};
    const tc = typeColor[p.type]||'var(--blue-600)';
    const tb = typeBg[p.type]||'var(--blue-50)';
    const ti = typeIcon[p.type]||'bi-folder';

    document.getElementById('project-content').innerHTML = `
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="inkuai-card mb-4">
          <div class="d-flex align-items-start gap-3 mb-4">
            <div style="width:52px;height:52px;background:${tb};border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <i class="bi ${ti} fs-4" style="color:${tc}"></i>
            </div>
            <div style="flex:1">
              <div class="d-flex align-items-center gap-2 flex-wrap mb-2">
                <h4 style="font-weight:700;color:var(--text-primary);margin:0">${p.title}</h4>
                <span class="status status-${p.status}">${p.status}</span>
                <span class="badge" style="background:${tb};color:${tc};font-size:0.72rem">${p.type}</span>
              </div>
              <div style="font-size:0.82rem;color:var(--text-muted)">
                Criado por <strong style="color:var(--text-primary)">${p.creator?.name||'—'}</strong> ·
                ${new Date(p.created_at).toLocaleDateString('pt-PT')} · v${p.version||'1.0.0'}
              </div>
            </div>
          </div>
          <p style="color:var(--text-secondary);margin-bottom:20px">${p.description||'Sem descrição.'}</p>
          ${p.github_repo_url?`
          <a href="${p.github_repo_url}" target="_blank" class="d-inline-flex align-items-center gap-2 text-decoration-none"
             style="background:var(--bg-page);border:1px solid var(--border-light);padding:8px 14px;border-radius:8px;color:var(--text-primary);font-size:0.875rem">
            <i class="bi bi-github"></i>${p.github_repo_url.replace('https://github.com/','')}
            <i class="bi bi-box-arrow-up-right" style="font-size:0.72rem;color:var(--text-muted)"></i>
          </a>`:''}
        </div>

        ${p.tech_stack?.length?`
        <div class="inkuai-card mb-4">
          <h6 style="font-weight:700;color:var(--text-primary);margin-bottom:12px"><i class="bi bi-layers me-2" style="color:var(--blue-600)"></i>Stack Tecnológico</h6>
          <div class="d-flex flex-wrap gap-2">${p.tech_stack.map(t=>`<span class="badge" style="background:var(--blue-50);color:var(--blue-700);font-size:0.8rem;padding:6px 12px">${t}</span>`).join('')}</div>
        </div>`:''}

        <div class="inkuai-card">
          <h6 style="font-weight:700;color:var(--text-primary);margin-bottom:16px"><i class="bi bi-star me-2" style="color:var(--warning)"></i>Avaliações (${p.evaluations?.length||0})</h6>
          ${p.evaluations?.length?p.evaluations.map(e=>`
          <div class="p-3 rounded-3 mb-3" style="background:var(--bg-page);border:1px solid var(--border-light)">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <span style="font-weight:600;color:var(--text-primary);font-size:0.875rem">${e.evaluator?.name||'Avaliador'}</span>
              <span style="color:var(--warning);font-weight:700">${e.score||0}/100</span>
            </div>
            <p style="color:var(--text-muted);font-size:0.82rem;margin:0">${e.feedback||'Sem feedback.'}</p>
          </div>`).join(''):`<p style="color:var(--text-muted);font-size:0.875rem">Ainda sem avaliações.</p>`}
        </div>
      </div>

      <div class="col-lg-4">
        <div class="inkuai-card mb-4">
          <h6 style="font-weight:700;color:var(--text-primary);margin-bottom:16px"><i class="bi bi-info-circle me-2" style="color:var(--blue-600)"></i>Informações</h6>
          <div class="d-flex flex-column gap-2" style="font-size:0.875rem">
            <div class="d-flex justify-content-between py-2" style="border-bottom:1px solid var(--border-light)">
              <span style="color:var(--text-muted)">Estado</span><span class="status status-${p.status}">${p.status}</span>
            </div>
            <div class="d-flex justify-content-between py-2" style="border-bottom:1px solid var(--border-light)">
              <span style="color:var(--text-muted)">Tipo</span><span style="color:var(--text-primary);font-weight:600">${p.type}</span>
            </div>
            <div class="d-flex justify-content-between py-2" style="border-bottom:1px solid var(--border-light)">
              <span style="color:var(--text-muted)">Versão</span><span style="color:var(--text-primary)">v${p.version||'1.0.0'}</span>
            </div>
            <div class="d-flex justify-content-between py-2" style="border-bottom:1px solid var(--border-light)">
              <span style="color:var(--text-muted)">Público</span>
              <span style="color:${p.is_public?'var(--success)':'var(--text-muted)'}">${p.is_public?'Sim':'Não'}</span>
            </div>
            <div class="d-flex justify-content-between py-2">
              <span style="color:var(--text-muted)">Criado em</span>
              <span style="color:var(--text-primary)">${new Date(p.created_at).toLocaleDateString('pt-PT')}</span>
            </div>
          </div>
        </div>

        ${p.tags?.length?`
        <div class="inkuai-card mb-4">
          <h6 style="font-weight:700;color:var(--text-primary);margin-bottom:12px"><i class="bi bi-tags me-2" style="color:var(--success)"></i>Tags</h6>
          <div class="d-flex flex-wrap gap-2">${p.tags.map(t=>`<span class="badge" style="background:#f0fdf4;color:var(--success);font-size:0.78rem">#${t}</span>`).join('')}</div>
        </div>`:''}

        <div class="inkuai-card">
          <h6 style="font-weight:700;color:var(--text-primary);margin-bottom:16px"><i class="bi bi-lightning me-2" style="color:var(--warning)"></i>Acções</h6>
          <div class="d-grid gap-2">
            <a href="/sandbox.html?project=${p.id}" class="btn btn-success btn-sm"><i class="bi bi-terminal me-2"></i>Abrir Sandbox</a>
            ${p.github_repo_url?`<a href="${p.github_repo_url}" target="_blank" class="btn btn-outline-secondary btn-sm"><i class="bi bi-github me-2"></i>Ver GitHub</a>`:''}
            ${isOwner&&p.status==='draft'?`<button onclick="submitProject('${p.id}')" class="btn btn-primary btn-sm"><i class="bi bi-send me-2"></i>Submeter para Avaliação</button>`:''}
          </div>
        </div>
      </div>
    </div>`;
  } catch(err) {
    document.getElementById('project-content').innerHTML=`<div class="text-center py-5 text-danger"><i class="bi bi-exclamation-triangle fs-1 d-block mb-3"></i>${err.message}</div>`;
  }
}

async function submitProject(id) {
  if (!confirm('Submeter este projecto para avaliação?')) return;
  try { await window.InkuAPI.post(`/projects/${id}/submit`); window.showToast?.('Projecto submetido!','success'); setTimeout(loadProject,800); }
  catch(err) { window.showToast?.(err.message,'error'); }
}
async function approveProject(id) {
  if (!confirm('Aprovar este projecto?')) return;
  try { await window.InkuAPI.post(`/projects/${id}/approve`); window.showToast?.('Projecto aprovado!','success'); setTimeout(loadProject,800); }
  catch(err) { window.showToast?.(err.message,'error'); }
}

const usr = window.InkuAuth?.getUser();
if(usr?.role==='admin') document.getElementById('admin-link').style.display='';
if(usr?.name) document.getElementById('user-avatar').textContent=usr.name[0].toUpperCase();
document.addEventListener('DOMContentLoaded', loadProject);
</script>
</body>
</html>

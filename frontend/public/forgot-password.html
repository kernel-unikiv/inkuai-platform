<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Password — INKU·AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/tokens.css" rel="stylesheet">
  <link href="/assets/css/main.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-logo"><i class="bi bi-key-fill text-white fs-4"></i></div>
      <h5 class="auth-title">Recuperar Password</h5>
      <p class="auth-subtitle mt-1">Introduza o seu email para receber as instruções</p>
    </div>
    <form id="forgot-form">
      <div class="mb-4">
        <label class="form-label-dark">Email institucional</label>
        <div class="position-relative">
          <i class="bi bi-envelope position-absolute" style="left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted)"></i>
          <input type="email" id="email" class="form-control-dark" style="padding-left:38px" placeholder="exemplo@ip.unikivi.ao" required>
        </div>
      </div>
      <button type="submit" class="btn-inkuai w-100 justify-content-center" style="height:44px">
        <i class="bi bi-envelope me-2"></i>Enviar Instruções
      </button>
    </form>
    <p class="text-center mt-4 mb-0" style="font-size:0.875rem;color:var(--text-muted)">
      <a href="/login.html" style="color:var(--blue-600);text-decoration:none"><i class="bi bi-arrow-left me-1"></i>Voltar ao login</a>
    </p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api/apiClient.js"></script>
<script src="/assets/js/components/toast.js"></script>
<script>
document.getElementById('forgot-form')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('[type=submit]');
  btn.disabled=true; btn.innerHTML='<span class="spinner-border spinner-border-sm me-2"></span>A enviar...';
  try {
    await window.InkuAPI.post('/auth/forgot-password', { email: document.getElementById('email').value });
    window.showToast?.('Se o email existir, receberá as instruções em breve.','success');
    setTimeout(()=>{ window.location.href='/login.html'; }, 2500);
  } catch(err) {
    window.showToast?.(err.message,'error');
    btn.disabled=false; btn.innerHTML='<i class="bi bi-envelope me-2"></i>Enviar Instruções';
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt" data-bs-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Password — INKU·AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/assets/css/main.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center mb-3" style="width:52px;height:52px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:12px">
        <i class="bi bi-key-fill text-white fs-4"></i>
      </div>
      <h5 class="fw-bold text-white mb-1">Recuperar Password</h5>
      <p class="text-muted small">Introduza o seu email para receber as instruções</p>
    </div>
    <form id="forgot-form">
      <div class="mb-4">
        <label class="form-label-dark">Email institucional</label>
        <input type="email" id="email" class="form-control-dark" placeholder="exemplo@ip.unikivi.ao" required>
      </div>
      <button type="submit" class="btn-inkuai w-100 justify-content-center mb-3">
        <i class="bi bi-envelope me-2"></i>Enviar Instruções
      </button>
    </form>
    <p class="text-center text-muted small mb-0"><a href="login.html" style="color:#3b82f6">← Voltar ao login</a></p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api/apiClient.js"></script>
<script src="/assets/js/components/toast.js"></script>
<script>
document.getElementById('forgot-form')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('[type=submit]');
  btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>A enviar...';
  try {
    await window.InkuAPI.post('/auth/forgot-password', { email: document.getElementById('email').value });
    window.showToast?.('Se o email existir, receberá as instruções em breve.','success');
    setTimeout(()=>{ window.location.href='login.html'; }, 2000);
  } catch(err) {
    window.showToast?.(err.message,'error');
    btn.disabled = false; btn.innerHTML = '<i class="bi bi-envelope me-2"></i>Enviar Instruções';
  }
});
</script>
</body>
</html>
